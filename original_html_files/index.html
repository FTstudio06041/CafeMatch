<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>啡你莫屬 - 找到你的命定咖啡</title>
    <style>
        :root {
            /* 延續主色調 */
            --bg-main: #ddccb9;
            --bg-white: #FFFFFF;
            --accent-color: #432a00;
            --text-main: #4E342E;
            --text-light: #795548;
            --border-radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            /* Allow scrolling if content is long */
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            /* Enable vertical scroll */
            overflow-x: hidden;
        }

        /* --- Header --- */
        .landing-header {
            padding: 15px 40px;
            /* Reduced padding */
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            height: 70px;
            /* Fixed height for calculation */
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            /* 讓 Logo 看起來可點擊 */
        }

        /* --- 新增：Header 右側按鈕群組 --- */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            /* 按鈕之間的間距 */
        }

        /* 1. 註冊與登入按鈕樣式 (文字型) */
        .btn-text {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .btn-text:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* 2. 開始使用按鈕樣式 (強調型) */
        .btn-primary-sm {
            background-color: var(--text-main);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .btn-primary-sm:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        /* --- 主內容區 --- */
        /* --- 主內容區 --- */
        .landing-container {
            /* Top section - minimized */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 5%;
            /* Reduced padding */
            gap: 20px;
            /* Reduced gap */
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            /* Allow it to shrink/grow */
            min-height: auto;
            /* Remove large min-height */
        }

        .section-brown {
            background-color: var(--accent-color);
            width: 100%;
            flex: 1.5;
            /* Give more space to video section */
            padding: 0 5%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: var(--bg-white);
            overflow: hidden;
            /* Prevent spill */
        }

        /* 左側：介紹與登入 (現在在上方) */
        .intro-section {
            width: 100%;
            max-width: 800px;
            /* Increase max-width for better centering */
            animation: slideInLeft 0.8s ease;
            margin-left: 0;
            /* Remove left margin */
            text-align: center;
            /* Center text */
            margin-top: 80px;
            /* Increased from 40px */
            /* Add spacing to move it down */
        }

        .main-title {
            font-size: 2.5rem;
            /* Reduced font size */
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 10px;
            /* Reduced margin */
            color: var(--accent-color);
        }

        .sub-title {
            font-size: 1rem;
            /* Reduced font size */
            color: var(--text-main);
            margin-bottom: 20px;
            /* Reduced margin */
            line-height: 1.5;
            opacity: 0.9;
        }

        .btn-google-login {
            background-color: var(--bg-white);
            color: var(--text-main);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            cursor: pointer;
            display: inline-flex;
            /* Changed to inline-flex for centering */
            align-items: center;
            gap: 15px;
            margin: 0 auto;
            /* Center the button */
            box-shadow: 0 4px 15px rgba(67, 42, 0, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-google-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(67, 42, 0, 0.2);
        }

        /* 右側：影片展示區 (現在在下方深色區塊內) */
        .demo-section {
            width: 100%;
            max-width: 1300px;
            /* 限制最大寬度 */
            display: flex;
            flex-direction: column;
            /* Revert to column */
            justify-content: center;
            align-items: center;
            gap: 0;
            /* Remove gap */
            animation: slideInRight 0.8s ease;
            margin-bottom: 0;
            /* 移除底部間距 */
        }

        .video-wrapper {
            margin: 0 auto;
            /* Center horizontally */
            /* Remove auto margin */
            /* Reduced from 900px to fit better */
            width: 65%;
            /* Slightly increased width since it's alone */
            max-width: 800px;
            /* Responsive width */

            /* Use modern aspect-ratio property */
            aspect-ratio: 16 / 9;

            position: relative;
            /* 讓內部的 video 可以絕對定位 */

            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            object-fit: cover;
            /* Ensure full 16:9 video is visible without black bars */

            z-index: 1;
        }



        /* 移除點點樣式 */

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <header class="landing-header">
        <div class="brand-logo" onclick="location.reload()"> <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                <line x1="6" y1="1" x2="6" y2="4"></line>
                <line x1="10" y1="1" x2="10" y2="4"></line>
                <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
            啡你莫屬
        </div>

        <div class="header-actions">
            <button class="btn-text" onclick="handleGoogleLogin()">註冊</button>
            <button class="btn-text" onclick="handleGoogleLogin()">登入</button>
            <button class="btn-primary-sm" onclick="handleGoogleLogin()">開始使用</button>
        </div>
    </header>

    <div class="landing-container">

        <div class="intro-section">
            <h1 class="main-title">找到你的<br>命定風味</h1>
            <p class="sub-title">
                不知道今天喝什麼？<br>
                讓 AI 咖啡師透過對話與心理測驗，<br>
                為你推薦最適合的咖啡豆與特色店家。
            </p>

            <button class="btn-google-login" onclick="handleGoogleLogin()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                使用 Google 帳號登入
            </button>
        </div>

    </div>

    <!-- 下方深色區塊 -->
    <div class="section-brown">
        <div class="demo-section">
            <div class="video-wrapper">
                <video id="demoVideo" autoplay muted loop playsinline>
                    <source src="assets/demo.mp4" type="video/mp4">
                    您的瀏覽器不支援影片播放。
                </video>
            </div>


        </div>
    </div>

    <script>
        // --- 1. 影片資料設定 (指向真實檔案) ---
        // --- 1. 登入邏輯 ---
        function handleGoogleLogin() {
            const btn = document.querySelector('.btn-google-login');

            // UI 回饋
            if (btn) {
                btn.innerHTML = '連接 Google 中...';
                btn.style.opacity = 0.8;
            }

            // 【關鍵修改】直接導向 Python 後端的登入路徑
            // 注意：這裡假設你的 Flask 跑在 5000 port
            window.location.href = 'http://127.0.0.1:5000/login';
        }

        // --- 2. 影片自動播放處理 (確保不會停止) ---
        const videoEl = document.getElementById('demoVideo');
        if (videoEl) {
            // 確保影片載入後才播放，避免黑畫面
            videoEl.play().catch(error => {
                console.log("Autoplay prevented:", error);
            });
        }

    </script>
</body>

</html>

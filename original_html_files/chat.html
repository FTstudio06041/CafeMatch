<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>啡你莫屬</title>
    <style>
        :root {
            /* 您的自訂配色 */
            --bg-main: #ddccb9;
            --bg-sidebar: #d6c2a5;
            --bg-input: #FFFFFF;
            --accent-color: #432a00;
            --text-main: #4E342E;
            --text-light: #795548;
            --msg-user: #cbbaac;
            --msg-ai: #cdb09a;
            --hover-color: #b5a191;

            --border-radius: 24px;
            --sidebar-width: 280px;
            --sidebar-width-collapsed: 88px;
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- 左側欄 --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: width var(--transition-speed) ease;
            position: relative;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: var(--sidebar-width-collapsed);
            padding: 20px 10px;
        }

        /* 收合按鈕 */
        .toggle-sidebar-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition-speed);
            z-index: 10;
        }

        .toggle-sidebar-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .sidebar.collapsed .toggle-sidebar-btn {
            transform: rotate(180deg);
            right: 50%;
            margin-right: -15px;
        }

        .text-label {
            opacity: 1;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        .sidebar.collapsed .text-label {
            opacity: 0;
            width: 0;
            margin: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .sidebar.collapsed .user-profile-btn,
        .sidebar.collapsed .new-chat-btn,
        .sidebar.collapsed .chat-item {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }

        /* 使用者按鈕 */
        .user-profile-btn {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #FFFFFF;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            margin-bottom: 20px;
            margin-top: 40px;
            transition: 0.2s;
            overflow: hidden;
            height: 70px;
        }

        .user-profile-btn:hover {
            background-color: var(--hover-color);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .sidebar.collapsed .user-avatar {
            margin-right: 0;
        }

        .user-name {
            font-weight: bold;
            color: var(--text-main);
        }

        /* 新增對話按鈕 */
        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: 2px dashed var(--text-light);
            border-radius: 16px;
            color: var(--text-main);
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 50px;
            overflow: hidden;
        }

        .new-chat-btn:hover {
            background-color: #ddccb9;
            border-color: var(--text-main);
        }

        .history-label {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 10px;
            padding-left: 10px;
            white-space: nowrap;
        }

        .sidebar.collapsed .history-label {
            display: none;
        }

        /* 動態列表區域 */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-list::-webkit-scrollbar {
            width: 5px;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background-color: #E0C0A0;
            border-radius: 10px;
        }

        .chat-item {
            padding: 12px 15px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            height: 50px;
        }

        .chat-item:hover {
            background-color: rgba(255, 255, 255, 0.6);
        }

        .chat-item.active {
            background-color: var(--accent-color);
            color: #fff;
        }

        .chat-icon {
            margin-right: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
        }

        .sidebar.collapsed .chat-icon {
            margin-right: 0;
        }

        .chat-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
            flex-grow: 1;
        }

        .delete-btn {
            opacity: 0;
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .chat-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background-color: rgba(0, 0, 0, 0.1);
            color: #D32F2F;
        }

        .sidebar.collapsed .delete-btn {
            display: none !important;
        }

        .empty-sidebar-msg {
            text-align: center;
            color: var(--text-light);
            opacity: 0.6;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        .sidebar.collapsed .empty-sidebar-msg {
            display: none;
        }

        /* --- 中間與右側 --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-main);
            transition: margin 0.3s;
        }

        /* --- 導覽列容器 --- */
        .navbar {
            display: flex;
            justify-content: flex-end;
            padding: 20px 30px;
            gap: 15px;
            position: relative;
            /* 為了讓滑塊絕對定位 */
            z-index: 1;
        }

        /* --- 新增：滑動的高亮塊 --- */
        .nav-marker {
            position: absolute;
            background-color: var(--text-main);
            height: 44px;
            border-radius: 20px;
            z-index: 0;

            /* 這裡把 transition 拿掉，改由 JS 動態添加 class 來控制 */
            /* transition: all 0.35s ... (移除這行) */

            width: 0;
            left: 0;
            top: 20px;
            opacity: 0;
        }

        /* 新增一個 class 專門負責動畫 */
        .nav-marker.animate {
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* --- 按鈕樣式調整 --- */
        .nav-btn {
            padding: 10px 24px;
            border: none;
            background: transparent;
            /* 重要：按鈕本身背景透明 */
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            border-radius: 20px;
            transition: color 0.2s;
            position: relative;
            z-index: 1;
            /* 確保文字在滑塊上面 */
        }

        .nav-btn:hover {
            color: var(--text-main);
            /* 移除原本的 hover 背景色，改用文字變色即可 */
        }

        /* 當按鈕被選中時 */
        .nav-btn.active {
            color: #fff;
            /* 文字變白 */
            /* 移除原本的 background-color */
        }

        .chat-window {
            flex: 1;
            padding: 20px 10%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .placeholder-zone {
            margin: auto;
            text-align: center;
            border-radius: 20px;
            padding: 40px;
            color: var(--text-light);
            background-color: rgba(255, 255, 255, 0.5);
            max-width: 500px;
            /* 稍微加寬以容納文字 */
            width: 100%;
        }

        .placeholder-zone h3 {
            margin-bottom: 15px;
            color: var(--text-main);
            font-size: 1.4rem;
        }

        .placeholder-zone p {
            line-height: 1.6;
        }

        /* 特殊連結樣式 */
        .quiz-link {
            color: var(--accent-color);
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.2s;
        }

        .quiz-link:hover {
            color: #000;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 4px;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--msg-user);
            border-bottom-right-radius: 5px;
        }

        .input-area {
            padding: 20px 10%;
            padding-bottom: 20px;
            background-color: var(--bg-main);
        }

        .input-wrapper {
            background-color: var(--bg-input);
            display: flex;
            align-items: center;
            padding: 8px 15px;
            border-radius: 30px;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-color);
        }

        .chat-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px;
            background: transparent;
        }

        .send-btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .disclaimer-text {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 10px;
            opacity: 0.8;
            user-select: none;
        }

        /* --- 打字中動畫 (Typing Indicator) --- */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 15px 20px;
            background-color: var(--msg-ai);
            /* 與 AI 訊息同色 */
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            /* 對話框小尾巴方向 */
            width: fit-content;
            align-self: flex-start;
            margin-bottom: 10px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.3s ease;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            /* 淺咖啡色圓點 */
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        .welcome-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            /* 半透明黑底 */
            backdrop-filter: blur(4px);
            /* 背景模糊效果 */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            /* 預設隱藏 */
            transition: opacity 0.3s ease;
        }

        .welcome-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .welcome-card {
            background: #fff;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .welcome-modal-overlay.active .welcome-card {
            transform: translateY(0);
        }

        .welcome-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .welcome-title {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: 900;
        }

        .welcome-text {
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .welcome-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-primary {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background: var(--text-main);
        }

        .btn-secondary {
            background: #eee;
            color: #666;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        @keyframes typingBounce {

            0%,
            80%,
            100% {
                transform: scale(0);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-item:focus,
        .chat-item:active,
        .delete-btn:focus,
        .delete-btn:active,
        button:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        .chat-item {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <aside class="sidebar" id="sidebar">
        <button class="toggle-sidebar-btn" id="toggleSidebarBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
        </button>

        <button class="user-profile-btn" onclick="window.location.href='user_profile.html'">
            <div class="user-avatar">U</div>
            <span class="user-name text-label">使用者名稱</span>
        </button>

        <button class="new-chat-btn" onclick="handleSidebarNewChat()" title="新增對話">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span class="text-label">新增對話</span>
        </button>

        <div class="history-label text-label">對話紀錄</div>

        <div class="chat-list" id="sidebarChatList">
            <div class="empty-sidebar-msg" id="sidebarEmptyMsg">尚無對話紀錄</div>
        </div>
    </aside>

    <main class="main-container">
        <nav class="navbar">
            <div class="nav-marker"></div> <button class="nav-btn active">對話</button> <button class="nav-btn"
                onclick="window.location.href='explore.html'">探索</button>
            <button class="nav-btn" onclick="window.location.href='quiz.html'">測驗</button>
        </nav>

        <div class="chat-window" id="chatWindow">
            <div class="placeholder-zone" id="placeholderZone">
                <h3>歡迎來到啡你莫屬</h3>
                <p>
                    您可以直接輸入訊息諮詢，或是進行
                    <span class="quiz-link" onclick="window.location.href='quiz.html'">心理測驗</span>
                    以獲得更精準的咖啡廳推薦。
                </p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" class="chat-input" placeholder="輸入訊息..." id="msgInput">
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="disclaimer-text">
                AI 生成內容可能含有錯誤，請斟酌採納生成內容。
            </div>
        </div>

        <div class="welcome-modal-overlay" id="welcomeModal">
            <div class="welcome-card">
                <h2 class="welcome-title">歡迎來到 啡你莫屬！</h2>
                <p class="welcome-text">
                    這似乎是您第一次來訪。<br>
                    建議您先進行心理測驗，<br>
                    讓啡啡更了解您的喜好喔！
                </p>
                <div class="welcome-actions">
                    <button class="btn-secondary" onclick="closeWelcomeModal()">先不用</button>
                    <button class="btn-primary" onclick="goToQuiz()">開始測驗</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- 1. 初始化與資料讀取 ---
        // 從 localStorage 讀取所有對話，若無則為空陣列
        let chats = JSON.parse(localStorage.getItem('allChats')) || [];
        let currentChatId = null;

        const generatingChats = new Set();
        const chatListEl = document.getElementById('sidebarChatList'); 
        const emptyMsgEl = document.getElementById('sidebarEmptyMsg'); 
        const chatWindow = document.getElementById('chatWindow');
        const msgInput = document.getElementById('msgInput');
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleSidebarBtn');

        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.get('welcome') === 'true') {
            const modal = document.getElementById('welcomeModal');
            if (modal) {
                setTimeout(() => {
                    modal.classList.add('active');
                }, 500);
            }
            const newUrl = window.location.pathname;
            window.history.replaceState({}, document.title, newUrl);
        }

        function closeWelcomeModal() {
            document.getElementById('welcomeModal').classList.remove('active');
        }

        function goToQuiz() {
            window.location.href = 'quiz.html';
        }

        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

        // ==========================================
        // 新增：呼叫 Flask 後端 AI API 的共用函式
        // ==========================================
        async function getAIResponse(userMessage) {
            try {
                const response = await fetch('http://127.0.0.1:5000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessage })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    return data.reply;
                } else {
                    return "抱歉，系統發生問題：" + (data.error || "未知錯誤");
                }
            } catch (error) {
                console.error("AI 連線錯誤:", error);
                return "糟糕！無法連線到 AI 伺服器，請確認後端或 Ollama 是否有開啟。";
            }
        }

        // --- 2. 檢查是否有跨頁請求 (Update) ---
        window.addEventListener('load', () => {
            renderChatList();

            const targetId = localStorage.getItem('targetChatId');
            const quizContext = localStorage.getItem('targetQuizContext'); 

            if (targetId) {
                localStorage.removeItem('targetChatId');
                if (targetId === 'new') addNewChat();
                else selectChat(parseInt(targetId));

            } else if (quizContext) {
                // --- 如果是從測驗/個人頁帶結果過來的 ---
                localStorage.removeItem('targetQuizContext'); 

                addNewChat(); 

                // 延遲一點點，模擬使用者輸入
                setTimeout(async () => {
                    const promptText = `我剛做完測驗，結果適合「${quizContext}」，請根據這個結果推薦我類似的咖啡廳或豆子。`;

                    const placeholders = chatWindow.querySelectorAll('.placeholder-zone');
                    placeholders.forEach(el => el.remove());

                    const currentChat = chats[0]; 
                    currentChat.messages.push({ role: 'user', content: promptText });

                    const userMsgDiv = document.createElement('div');
                    userMsgDiv.className = 'message user';
                    userMsgDiv.innerText = promptText;
                    chatWindow.appendChild(userMsgDiv);

                    // 顯示打字動畫
                    const loadingDiv = document.createElement('div');
                    loadingDiv.className = 'typing-indicator';
                    loadingDiv.innerHTML = `<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
                    chatWindow.appendChild(loadingDiv);
                    chatWindow.scrollTop = chatWindow.scrollHeight;

                    // 呼叫真實 AI
                    const aiText = await getAIResponse(promptText);

                    // 移除打字動畫並顯示結果
                    loadingDiv.remove();
                    currentChat.messages.push({ role: 'ai', content: aiText });
                    saveChatsToLocal();

                    const aiMsgDiv = document.createElement('div');
                    aiMsgDiv.className = 'message ai';
                    aiMsgDiv.innerText = aiText;
                    chatWindow.appendChild(aiMsgDiv);
                    chatWindow.scrollTop = chatWindow.scrollHeight;

                }, 300);

            } else {
                resetChatWindow();
            }
        });

        // --- 3. 核心功能 ---
        function saveChatsToLocal() {
            localStorage.setItem('allChats', JSON.stringify(chats));
        }

        function handleSidebarNewChat() {
            addNewChat();
        }

        function addNewChat() {
            const newId = Date.now();
            const newChat = {
                id: newId,
                title: '新對話 ' + (chats.length + 1),
                messages: []
            };

            chats.unshift(newChat);
            saveChatsToLocal(); 
            renderChatList();
            selectChat(newId);
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            if (confirm('確定要刪除此對話嗎？')) {
                chats = chats.filter(c => c.id !== id);
                saveChatsToLocal(); 

                if (currentChatId === id) {
                    currentChatId = null;
                    resetChatWindow();
                }
                renderChatList();
            }
        }

        function selectChat(id) {
            currentChatId = id;
            renderChatList();
            
            // 👉 切換對話時，檢查這個對話是不是正在生成，更新輸入框狀態
            updateInputState(); 

            chatWindow.innerHTML = '';
            const currentChat = chats.find(c => c.id === id);

            if (!currentChat) return;

            if (currentChat.messages.length === 0) {
                chatWindow.innerHTML = getWelcomeHTML();
            } else {
                currentChat.messages.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.role}`;
                    msgDiv.innerText = msg.content;
                    chatWindow.appendChild(msgDiv);
                });

                // 👉 如果這個對話還在背景思考，把打字動畫補回去
                if (generatingChats.has(id)) {
                    const loadingDiv = document.createElement('div');
                    loadingDiv.className = 'typing-indicator';
                    loadingDiv.id = `loading-${id}`; // 綁定 ID
                    loadingDiv.innerHTML = `<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
                    chatWindow.appendChild(loadingDiv);
                }

                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }

        function renderChatList() {
            chatListEl.innerHTML = '';
            if (chats.length === 0) {
                chatListEl.appendChild(emptyMsgEl);
                emptyMsgEl.style.display = 'block';
                return;
            } else {
                emptyMsgEl.style.display = 'none';
            }

            // 直接接續迴圈，畫出側邊欄列表
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.onclick = () => selectChat(chat.id);
                item.title = chat.title;

                const iconDiv = document.createElement('div');
                iconDiv.className = 'chat-icon';
                iconDiv.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';

                const titleSpan = document.createElement('span');
                titleSpan.className = 'chat-title text-label';
                titleSpan.innerText = chat.title;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
                delBtn.onclick = (e) => deleteChat(e, chat.id);

                item.appendChild(iconDiv);
                item.appendChild(titleSpan);
                item.appendChild(delBtn);
                chatListEl.appendChild(item);
            });
        } // 👈 這裡才是 renderChatList 真正的結尾！

        function updateInputState() {
            if (generatingChats.has(currentChatId)) {
                msgInput.disabled = true;
                msgInput.placeholder = "AI 正在思考中...";
            } else {
                msgInput.disabled = false;
                msgInput.placeholder = "輸入訊息...";
            }
        }

        function getWelcomeHTML() {
            return `
                <div class="placeholder-zone" style="display:block;">
                    <h3>歡迎來到啡你莫屬</h3>
                    <p>
                        您可以直接輸入訊息諮詢，或是進行
                        <span class="quiz-link" onclick="window.location.href='quiz.html'">心理測驗</span>
                        以獲得更精準的咖啡推薦。
                    </p>
                </div>
            `;
        }

        function resetChatWindow() {
            chatWindow.innerHTML = getWelcomeHTML();
        }

        // --- 發送訊息邏輯 (改為非同步呼叫真實 AI) ---
        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            if (!currentChatId) {
                addNewChat();
            }

            // 👉 核心秘訣：記住當下是哪個對話發出的請求 (快照)
            const targetChatId = currentChatId;
            const targetChat = chats.find(c => c.id === targetChatId);

            // 如果這個對話已經在等 AI 了，就不允許重複送出
            if (generatingChats.has(targetChatId)) return; 

            // 1. 把這個對話加入「思考中清單」並更新 UI
            generatingChats.add(targetChatId);
            updateInputState();
            msgInput.value = '';

            // 2. 先把使用者的訊息「存進資料庫」
            targetChat.messages.push({ role: 'user', content: text });
            if (targetChat.title.startsWith('新對話')) {
                targetChat.title = text.substring(0, 10) + '...';
            }
            saveChatsToLocal();
            renderChatList();

            // 3. 如果使用者還看著這個對話，才更新畫面
            if (currentChatId === targetChatId) {
                const placeholders = chatWindow.querySelectorAll('.placeholder-zone');
                placeholders.forEach(el => el.remove());

                const userMsgDiv = document.createElement('div');
                userMsgDiv.className = 'message user';
                userMsgDiv.innerText = text;
                chatWindow.appendChild(userMsgDiv);

                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'typing-indicator';
                loadingDiv.id = `loading-${targetChatId}`;
                loadingDiv.innerHTML = `<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
                chatWindow.appendChild(loadingDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }

            // ==========================================
            // 4. 等待真實 AI 回覆 (此時使用者可以自由切換去別的對話)
            // ==========================================
            const aiText = await getAIResponse(text);

            // 5. AI 回來了！把結果存回最初的那個對話 (不管使用者切去哪，資料都不會丟)
            targetChat.messages.push({ role: 'ai', content: aiText });
            saveChatsToLocal();
            
            // 任務完成，從思考清單移除
            generatingChats.delete(targetChatId); 

            // 6. 如果使用者剛好正在看這個對話，就把結果顯示出來
            if (currentChatId === targetChatId) {
                const loadingDiv = document.getElementById(`loading-${targetChatId}`);
                if (loadingDiv) loadingDiv.remove();

                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = 'message ai';
                aiMsgDiv.innerText = aiText;
                chatWindow.appendChild(aiMsgDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;

                updateInputState();
                msgInput.focus();
            }
        }

        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // --- 導覽列滑塊動畫邏輯 (維持不變) ---
        function initNavMarker() {
            const marker = document.querySelector('.nav-marker');
            const navButtons = document.querySelectorAll('.nav-btn');
            const activeBtn = document.querySelector('.nav-btn.active');
            const navContainer = document.querySelector('.navbar');

            if (!marker || !activeBtn) return;

            function setMarker(target, animate = true) {
                if (!target) return;
                if (!animate) {
                    marker.classList.remove('animate');
                } else {
                    marker.classList.add('animate');
                }
                marker.style.width = `${target.offsetWidth}px`;
                marker.style.left = `${target.offsetLeft}px`;
                marker.style.top = `${target.offsetTop}px`;
                marker.style.opacity = '1';

                navButtons.forEach(btn => {
                    if (btn === target) btn.style.color = '#fff';
                    else btn.style.color = '';
                });
            }

            const savedLeft = sessionStorage.getItem('navMarkerLeft');
            const savedWidth = sessionStorage.getItem('navMarkerWidth');

            if (savedLeft && savedWidth) {
                marker.classList.remove('animate');
                marker.style.left = savedLeft;
                marker.style.width = savedWidth;
                marker.style.top = '20px'; 
                marker.style.opacity = '1';

                void marker.offsetWidth;

                setTimeout(() => {
                    setMarker(activeBtn, true);
                }, 50);
            } else {
                setMarker(activeBtn, false);
                setTimeout(() => marker.classList.add('animate'), 100);
            }

            navButtons.forEach(btn => {
                btn.addEventListener('mouseenter', (e) => setMarker(e.target, true));

                btn.addEventListener('click', (e) => {
                    sessionStorage.setItem('navMarkerLeft', `${e.currentTarget.offsetLeft}px`);
                    sessionStorage.setItem('navMarkerWidth', `${e.currentTarget.offsetWidth}px`);

                    navButtons.forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    setMarker(e.currentTarget, true);
                });
            });

            navContainer.addEventListener('mouseleave', () => {
                const currentActive = document.querySelector('.nav-btn.active');
                if (currentActive) {
                    setMarker(currentActive, true);
                }
            });
        }

        fetch('http://127.0.0.1:5000/api/me', {
            method: 'GET',
            credentials: 'include'
        })
            .then(response => {
                if (response.status === 401) {
                    console.log("未登入或 Session 失效");
                    return null;
                }
                return response.json();
            })
            .then(data => {
                if (data && data.is_logged_in) {
                    console.log("登入成功，資料為:", data); 
                    const avatarElements = document.querySelectorAll('.user-avatar');
                    avatarElements.forEach(el => {
                        if (data.picture) {
                            el.innerText = '';
                            el.innerHTML = `<img src="${data.picture}" style="width:100%; height:100%; border-radius:50%; object-fit: cover;">`;
                            el.style.backgroundColor = 'transparent';
                        }
                    });

                    const nameElements = document.querySelectorAll('.user-name');
                    nameElements.forEach(el => {
                        if (data.name) el.innerText = data.name;
                    });
                }
            })
            .catch(err => {
                console.error("連線錯誤:", err);
            });

        setTimeout(initNavMarker, 50);
        window.addEventListener('resize', initNavMarker);
    </script>
</body>

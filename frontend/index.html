<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="啡你莫屬 (CafeMatch) 是一個幫助您透過人格測驗與探索系統，找到最適合自己風格咖啡廳的平台。" />
    <meta name="theme-color" content="#d5bea4" />
    <title>啡你莫屬 CafeMatch</title>
    <script>
      // 統一使用不含 www 的網域。Google 登入的回呼網址固定是 cafematch.net，
      // 從 www 開始登入的話 session cookie 帶不過去，回呼時 state 對不上就會失敗。
      if (location.hostname.indexOf('www.') === 0) {
        location.replace(location.protocol + '//' + location.hostname.slice(4) +
          (location.port ? ':' + location.port : '') +
          location.pathname + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

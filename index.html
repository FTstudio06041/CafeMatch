<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>啡你莫屬 - 找到你的命定咖啡</title>
    <style>
        :root {
            /* 延續主色調 */
            --bg-main: #ddccb9;       
            --bg-white: #FFFFFF;      
            --accent-color: #432a00;  
            --text-main: #4E342E;     
            --text-light: #795548;    
            --border-radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        .landing-header {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer; /* 讓 Logo 看起來可點擊 */
        }

        /* --- 新增：Header 右側按鈕群組 --- */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px; /* 按鈕之間的間距 */
        }

        /* 1. 註冊與登入按鈕樣式 (文字型) */
        .btn-text {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .btn-text:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* 2. 開始使用按鈕樣式 (強調型) */
        .btn-primary-sm {
            background-color: var(--text-main);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .btn-primary-sm:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        /* --- 主內容區 --- */
        .landing-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5%;
            gap: 60px;
            max-width: 1300px; 
            margin: 0 auto;    
        }

        /* 左側：介紹與登入 */
        .intro-section {
            flex: 1;
            max-width: 500px;
            animation: slideInLeft 0.8s ease;
            margin-left: 8%; 
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .sub-title {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 40px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .btn-google-login {
            background-color: var(--bg-white);
            color: var(--text-main);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(67, 42, 0, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-google-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(67, 42, 0, 0.2);
        }

        /* 右側：影片展示區 */
        .demo-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: slideInRight 0.8s ease;
        }

        .video-wrapper {
            width: 100%;
            max-width: 650px;
            /* 關鍵：利用 padding-bottom 撐開高度 */
            /* 56.25% = 9 / 16 * 100% (即 16:9) */
            /* 如果您的影片是 4:3，請改為 75% */
            padding-bottom: 56.25%; 
            height: 0; /* 高度設為 0，完全靠 padding 撐開 */
            position: relative; /* 讓內部的 video 可以絕對定位 */
            
            background-color: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            margin: 0 auto 25px auto;
            flex-shrink: 0; 
        }

        video {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 關鍵：裁切多餘部分，填滿容器，不變形 */
            z-index: 1;
        }

        .feature-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
            text-align: center;
            
            height: 80px;
            
            /* 鎖定寬度與最大寬度 */
            width: 100%;
            max-width: 650px;
            
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            overflow: hidden;
            
            transition: opacity 0.3s;
            
            /* 關鍵修正：透過 margin: auto 讓自己在父容器中水平居中 */
            margin: 0 auto 15px auto;
        }

        .indicators {
            display: flex;
            gap: 12px;
            margin: 0 auto;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: rgba(78, 52, 46, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active {
            background-color: var(--accent-color);
            transform: scale(1.2);
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

    </style>
</head>
<body>

    <header class="landing-header">
        <div class="brand-logo" onclick="location.reload()"> <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
            啡你莫屬
        </div>

        <div class="header-actions">
            <button class="btn-text" onclick="handleGoogleLogin()">註冊</button>
            <button class="btn-text" onclick="handleGoogleLogin()">登入</button>
            <button class="btn-primary-sm" onclick="handleGoogleLogin()">開始使用</button>
        </div>
    </header>

    <div class="landing-container">
        
        <div class="intro-section">
            <h1 class="main-title">找到你的<br>命定風味</h1>
            <p class="sub-title">
                不知道今天喝什麼？<br>
                讓 AI 咖啡師透過對話與心理測驗，<br>
                為你推薦最適合的咖啡豆與特色店家。
            </p>
            
            <button class="btn-google-login" onclick="handleGoogleLogin()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                使用 Google 帳號登入
            </button>
        </div>

        <div class="demo-section">
            <div class="video-wrapper">
                <video id="demoVideo" autoplay muted playsinline>
                    <source src="" type="video/mp4">
                    您的瀏覽器不支援影片播放。
                </video>
            </div>
            
            <div class="feature-text" id="featureText">AI 智慧對話：就像跟朋友聊天一樣輕鬆</div>
            
            <div class="indicators">
                <div class="dot active" onclick="switchVideo(0)"></div>
                <div class="dot" onclick="switchVideo(1)"></div>
                <div class="dot" onclick="switchVideo(2)"></div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. 影片資料設定 (指向真實檔案) ---
        const slides = [
            {
                videoSrc: 'assets/demo_chat.mp4', 
                text: 'AI 智慧對話：就像跟朋友聊天一樣，輕鬆獲得專業建議。'
            },
            {
                videoSrc: 'assets/demo_explore.mp4',
                text: '探索好店：一鍵收藏心儀店家，打造專屬咖啡地圖。'
            },
            {
                videoSrc: 'assets/demo_quiz.mp4',
                text: '心理測驗：30秒快速分析，找出你的命定風味。'
            }
        ];

        let currentIndex = 0;
        const videoEl = document.getElementById('demoVideo');
        const textEl = document.getElementById('featureText');
        const dots = document.querySelectorAll('.dot');
        
        // --- 2. 切換影片邏輯 ---
        function switchVideo(index) {
            currentIndex = index;
            const slide = slides[currentIndex];

            // A. 文字淡出動畫
            textEl.style.opacity = 0;
            
            // B. 更新點點狀態
            dots.forEach(d => d.classList.remove('active'));
            dots[currentIndex].classList.add('active');

            setTimeout(() => {
                // C. 文字淡入並更新內容
                textEl.innerText = slide.text;
                textEl.style.opacity = 1;

                // D. 切換影片來源並播放
                videoEl.src = slide.videoSrc;
                
                // 重要：確保影片載入後才播放，避免黑畫面
                videoEl.load(); 
                videoEl.play().catch(error => {
                    // 處理瀏覽器可能阻擋自動播放的情況 (雖然有 muted 應該不會)
                    console.log("Autoplay prevented:", error);
                });

            }, 300); // 配合 CSS transition 時間
        }

        function nextSlide() {
            let nextIndex = (currentIndex + 1) % slides.length;
            switchVideo(nextIndex);
        }

        // --- 3. 自動輪播邏輯 (改進版) ---
        
        // 監聽影片「播放結束 (ended)」事件
        // 當一支影片播完，自動切換下一支，這樣時間最準確，不會切斷影片
        videoEl.addEventListener('ended', () => {
            nextSlide();
        });

        // 點擊點點時，直接切換
        dots.forEach((dot, idx) => {
            dot.addEventListener('click', () => {
                switchVideo(idx);
            });
        });

        // --- 4. 登入邏輯 ---
        function handleGoogleLogin() {
            const btn = document.querySelector('.btn-google-login');
            
            // UI 回饋
            if(btn) {
                btn.innerHTML = '連接 Google 中...';
                btn.style.opacity = 0.8;
            }

            // 【關鍵修改】直接導向 Python 後端的登入路徑
            // 注意：這裡假設你的 Flask 跑在 5000 port
            window.location.href = 'http://127.0.0.1:5000/login';
        }

        // --- 初始化：啟動第一支影片 ---
        // 頁面載入後，先設定好第一支影片的路徑，但讓瀏覽器自己處理 autoplay
        videoEl.src = slides[0].videoSrc;
        
        // 確保初始文字正確
        textEl.innerText = slides[0].text;

    </script>
</body>
</html>
